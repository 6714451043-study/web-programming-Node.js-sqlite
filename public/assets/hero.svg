<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Sky/gradient background -->
  <rect width="600" height="400" fill="#FB9E09"/>
  <rect y="240" width="600" height="160" fill="#D13704" opacity="0.85"/>

  <!-- Sun -->
  <circle cx="480" cy="120" r="50" fill="#F0C88E"/>

  <!-- Mountains silhouette -->
  <polygon points="0,240 120,150 200,200 320,100 420,180 520,140 600,200 600,240" fill="#65463E" opacity="0.7"/>

  <!-- Center label -->
  <rect x="180" y="170" width="240" height="60" fill="#65463E" opacity="0.85" rx="6"/>
  <text x="300" y="200" font-family="Sarabun, sans-serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-weight="700">รูปภาพ Hero</text>
  <text x="300" y="220" font-family="Sarabun, sans-serif" font-size="11" fill="#F0C88E" text-anchor="middle">เปลี่ยนเป็นภาพธุรกิจของคุณได้</text>
</svg>
